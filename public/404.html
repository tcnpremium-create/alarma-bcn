<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Página 404 estática servida por Vercel cuando ninguna regla de
      vercel.json casa con la URL pedida. Es deliberadamente estática (no
      arranca la SPA) para que la respuesta sea un 404 real, inmediato y
      sin contenido de la home: antes, el catch-all "/(.*) -> /index.html"
      devolvía 200 con una copia completa de la home para cualquier URL
      inexistente (soft 404 global).

      Sin canonical, sin Open Graph y con noindex: esta URL no debe
      indexarse ni consolidarse hacia ninguna otra.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Página no encontrada | Premium Tech Security</title>
    <link rel="icon" type="image/webp" href="/images/logo-premium-negro.webp" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: linear-gradient(135deg, #0A1628 0%, #1a2f4a 100%);
        color: #fff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        line-height: 1.6;
      }
      .box { max-width: 560px; width: 100%; text-align: center; }
      .logo { height: 44px; width: auto; margin: 0 auto 32px; display: block; }
      .code {
        font-size: 13px; font-weight: 700; letter-spacing: 0.18em;
        text-transform: uppercase; color: #E63946; margin: 0 0 12px;
      }
      h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 800; margin: 0 0 14px; line-height: 1.2; }
      p { color: rgba(255,255,255,0.7); font-size: 16px; margin: 0 auto 30px; max-width: 44ch; }
      .links {
        display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 30px;
      }
      .links a {
        display: inline-block; padding: 11px 20px; border-radius: 50px;
        border: 1px solid rgba(255,255,255,0.22); color: #fff;
        text-decoration: none; font-size: 14px; font-weight: 600;
        transition: background 0.2s, border-color 0.2s;
      }
      .links a:hover, .links a:focus-visible { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.45); }
      .links a.primary { background: #E63946; border-color: #E63946; }
      .links a.primary:hover, .links a.primary:focus-visible { background: #c92f3b; border-color: #c92f3b; }
      .contact { border-top: 1px solid rgba(255,255,255,0.12); padding-top: 22px; }
      .contact a { color: #fff; font-weight: 700; font-size: 18px; text-decoration: none; }
      .contact span { display: block; color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 6px; }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="box">
      <img class="logo" src="/images/logo-premium-blanco.webp" alt="Premium Tech Security" />
      <p class="code">Error 404</p>
      <h1>Esta página no existe</h1>
      <p>Puede que el enlace esté mal escrito o que la página ya no esté disponible. Estas son las secciones principales:</p>
      <nav class="links">
        <a class="primary" href="/">Inicio</a>
        <a href="/alarmas-barcelona">Alarmas</a>
        <a href="/camaras-barcelona">Cámaras de seguridad</a>
        <a href="/videoporteros">Videoporteros</a>
        <a href="/Blog">Blog</a>
        <a href="/Contact">Contacto</a>
      </nav>
      <div class="contact">
        <span>¿Necesitas ayuda?</span>
        <a href="tel:+34638109947">638 10 99 47</a>
      </div>
    </main>
  </body>
</html>
