name: SEO - test de servicios y snapshots

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/prerender-*'
      - 'public/__prerendered__/**'
      - 'public/sitemap.xml'
      - 'package.json'
      - '.github/workflows/seo-service-pages.yml'
  push:
    branches:
      - 'seo/block-stale-snapshots-and-test-services-20261111'

permissions:
  contents: read

jobs:
  seo-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Descargar código de la revisión
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Ejecutar pruebas del proyecto, incluidas las siete landings
        run: npm test
      - name: Garantizar huella al día y build de producción
        run: npm run build
