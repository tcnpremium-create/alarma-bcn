name: SEO - regenerar HTML del catálogo de servicios

on:
  push:
    branches:
      - seo/servicios-enlaces-prerender-20261111
    paths:
      - src/pages/Servicios.jsx
      - scripts/prerender-fingerprint.mjs
      - .github/workflows/seo-servicios-prerender.yml

permissions:
  contents: write

concurrency:
  group: seo-prerender-servicios
  cancel-in-progress: false

jobs:
  prerender-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout de la rama de trabajo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias del proyecto
        run: npm ci

      - name: Instalar navegador temporal para prerender
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Seleccionar el Chromium instalado
        run: echo "PW_CHROMIUM_PATH=$(node -e \"console.log(require('playwright').chromium.executablePath())\")" >> "$GITHUB_ENV"

      - name: Regenerar prerender con React actualizado
        run: npm run prerender

      - name: Comprobar enlaces internos en el HTML que recibirá Google
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html = readFileSync('public/__prerendered__/Servicios.html', 'utf8');
          for (const url of ['/camaras-barcelona', '/alarmas-barcelona', '/videoporteros', '/control-accesos', '/cerraduras', '/redes-informaticas', '/sonorizacion']) {
            assert.ok(html.includes('href="' + url + '"'), 'Falta enlace SEO hacia ' + url);
          }
          assert.ok(html.includes('Instalación y sustitución de videoporteros'), 'Falta texto de videoporteros');
          NODE

      - name: Ejecutar tests
        run: npm test

      - name: Publicar snapshots actualizados solo en la rama SEO
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/__prerendered__/Servicios.html scripts/prerender-manifest.json scripts/prerender-fingerprint.json vercel.json
          if git diff --cached --quiet; then
            echo "No hay snapshots nuevos que guardar."
          else
            git commit -m "build(seo): actualizar HTML indexable de Servicios y huella de prerender"
            git push origin HEAD:"$BRANCH_NAME"
          fi
