name: Build check
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and report exact error
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run build > /tmp/build.log 2>&1
          code=$?
          cat /tmp/build.log
          if [ "$code" -ne 0 ]; then
            tail -n 80 /tmp/build.log > /tmp/tail.log
            gh issue create --title "CI build error (auto)" --body-file /tmp/tail.log
            exit "$code"
          fi
