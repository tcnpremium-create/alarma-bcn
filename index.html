    <!-- Verificación de propiedad del sitio para AdSense — metadato inerte,
         no carga ningún script ni cookie por sí solo (el script real de
         AdSense sigue condicionado al consentimiento, ver más abajo). -->
    <meta name="google-adsense-account" content="ca-pub-9051549124466549" />

    <!--
      IMPORTANTE — no añadir aquí <title>, <meta name="description">,
      <link rel="canonical">, og:*, twitter:* ni geo:*.

      Esta es una SPA sin renderizado en servidor: cada ruta recibe este
      mismo index.html sin JS ejecutado todavía. Si estos tags se
      hardcodean aquí con los valores de Home, react-helmet-async los
      AÑADE (no los sustituye) cuando cada página monta su propio
      <AdvancedSEO>/<CityLandingSEO>/<LocalitySEO>, dejando 2 tags
      duplicados en el DOM final — y el primero (el de Home, incorrecto)
      es el que devuelven document.querySelector() y la mayoría de
      herramientas de rastreo, apuntando el canonical de TODAS las
      páginas a la home.

      Cada página pública ya gestiona su propio <title>/description/
      canonical/og/twitter/geo vía Helmet (AdvancedSEO, CityLandingSEO,
      LocalitySEO o un <Helmet> propio) — ver informe de auditoría de
      producción. Si en el futuro se detecta una ruta pública sin
      cobertura, la solución es añadirle uno de esos componentes, nunca
      volver a hardcodear valores aquí.
    -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Schema LocalBusiness / FAQPage: gestionados por AdvancedSEO / CityLandingSEO
         / LocalitySEO en cada página (ver comentario arriba) — no duplicar aquí. -->

    <!--
      Analítica y publicidad — carga condicionada al consentimiento de
      cookies (ver src/lib/consent.js y src/components/CookieBanner.jsx).
      Antes gtag/AdSense/HubSpot se cargaban aquí sin condición alguna,
      ejecutándose antes de que el usuario pudiera aceptar o rechazar —
      incumplimiento real de RGPD/LOPD-GDD. Ahora el bootstrap de
      consentimiento vive en src/main.jsx y solo inyecta estos scripts
      si ya hay consentimiento guardado (o en cuanto el usuario acepta).
    -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
